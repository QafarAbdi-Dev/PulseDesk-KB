version: "3.9"

services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pulsedesk2026
      POSTGRES_DB: pulsedesk_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
  backend:
    build: ./backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:pulsedesk2026@db:5432/pulsedesk_db
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata: